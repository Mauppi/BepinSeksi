## Settings file was created by plugin WeatherGordion v1.4.0
## Plugin GUID: Timofey.WeatherGordion

[1. General]

## Master switch. When off the plugin changes nothing and Gordion stays clear.
# Setting type: Boolean
# Default value: true
Enabled = true

## Verbose logging: which weathers were unlocked, weights written, time transitions.
# Setting type: Boolean
# Default value: false
DebugMode = false

## Report why the HUD clock is or is not on screen: the state of the vanilla element and everything above it, which mods have patched the clock methods, and whether its alpha is being cleared between frames. Off now that the cause is known — turn it on if the clock ever goes missing again, and the log will say which link in the chain broke.
# Setting type: Boolean
# Default value: false
Clock diagnostics = false

[2. Weathers]

## Weight of clear weather (None) on Gordion, i.e. how often the moon stays as it is in vanilla. Set to 0 to guarantee some weather on every visit.
# Setting type: Int32
# Default value: 200
# Acceptable value range: From 0 to 10000
Clear weather weight = 200

## Semicolon-separated weathers that must never occur on Gordion, including as part of a combined or progressing weather. This is stronger than switching a weather off in its own section: '[Weather.Rainy] Enabled = false' only removes plain rain, while 'Stormy + Rainy' is a separate weather that turns the rain on as well. Listing 'Rainy' here refuses both, and every other combination containing rain. Written for exactly that case — rain's puddles do not render correctly at the Company. Example: Rainy; Flooded
# Setting type: String
# Default value: 
Never allow, even in combinations = 

## Leave a weather alone if it already has a Gordion weight in mrov.WeatherRegistry.cfg. Keeps hand-tuned entries (for example an Eclipsed you unblocked yourself) from being overwritten by this mod's defaults.
# Setting type: Boolean
# Default value: true
Respect existing config = true

[3. Time]

## Off       - no day cycle; weather is fixed for the whole visit (vanilla behaviour).
## RealTime  - start the game's own clock on Gordion while landed, so progressing weather, the rising Flooded water and the HUD clock all work. planetHasTime is deliberately left alone, so the ship still never leaves on its own, no end-of-round stats screen appears, and landing late in the day is not blocked.
## Simulated - never touch the game clock at all; drive weather stages and the HUD clock from this mod's own timer instead. Use it if RealTime upsets another mod.
# Setting type: GordionTimeMode
# Default value: RealTime
# Acceptable values: Off, RealTime, Simulated
Gordion time mode = RealTime

## RealTime only. The vanilla clock drains the quota deadline as it runs, which on Gordion would both cost you days and move the company buying rate — neither happens in vanilla, where the clock is stopped. Leave this on to hold the deadline still for the visit.
# Setting type: Boolean
# Default value: true
Freeze deadline on Gordion = false

## RealTime only. Let the ship fly off on its own when the Gordion day runs out, exactly as it does on every other moon, with the usual warning at 90% of the day. Vanilla cannot do this at the Company because the whole midnight-departure branch sits behind planetHasTime, so the mod calls the game's own networked departure itself. Turn it off to keep leaving manual and never risk being cut off mid-sale.
# Setting type: Boolean
# Default value: true
Ship leaves at end of day = true

## RealTime only. Give dead players the vanilla 'Tell autopilot ship to leave early' prompt on Gordion, so the last one alive is warned and the round can end sooner. The vote, the count and the warning are the game's own; vanilla only hides the prompt because the Company has no day. A passed vote sends the ship off even when 'Ship leaves at end of day' is turned off.
# Setting type: Boolean
# Default value: true
Spectators can vote to leave = true

## Show the HUD clock while on Gordion, indoors included. Vanilla hides the clock whenever you count as inside, which at the Company is most of the visit, so the mod asserts it instead. Works in both RealTime and Simulated.
# Setting type: Boolean
# Default value: true
Show clock on Gordion = true

## Simulated only: real seconds for a full Gordion day, i.e. how long progressing weather takes to run through all of its stages.
# Setting type: Single
# Default value: 1200
# Acceptable value range: From 60 to 7200
Day length seconds = 1200

