[_All All Enemies]

## This will make all inside enemies spawn inside and outside and all outside enemies spawn inside and outside, so giants and worms can spawn inside, enable both 'All' and 'All All' if you are a sadist. This will make the game harder.
# Setting type: Boolean
# Default value: false
Enable? = false

## This is the weight chance for a spawn to not occur.
# Setting type: Single
# Default value: 400
All enemies nothing weight = 400

## How often will this cycle attempt to spawn enemies? in seconds
# Setting type: Single
# Default value: 86
Spawn interval = 86

[_All Enemies]

## This will make all enemies capable of spawning on all moons, this will make the game harder.
# Setting type: Boolean
# Default value: false
Enable? = false

## This is the weight chance for a spawn to not occur.
# Setting type: Single
# Default value: 400
All enemies nothing weight = 400

## How often will this cycle attempt to spawn an enemy? in seconds
# Setting type: Single
# Default value: 86
Spawn interval = 86

