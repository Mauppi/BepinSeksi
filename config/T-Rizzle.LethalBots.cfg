##  Wander: The bot follows, but will wander around where you are standing 
##  Nearby: The bot follows by picking a random position nearby you
# Setting type: EnumFollowType
# Default value: Standard
# Acceptable values: Standard, Wander, Nearby
Default follow type (Client only) = Wander

