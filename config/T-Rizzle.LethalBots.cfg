# Setting type: Boolean
# Default value: true
Require every bot to help sell at the Company = true

## Allow any living bot physically inside the ship to operate usable ship doors for crew safety. Bots close for an immediate dangerous ship-area threat, or after return time once everyone is safely inside, and reopen for a living crew member waiting near the entrance. Returning crew, normal power/overheat limits, command cooldowns, and a brief manual-player override grace take priority.
# Setting type: Boolean
# Default value: true
Allow bots to close the ship doors = true

## Should the bot who is the active mission controller automatically route to the company building when there are 0 days left in the profit quota?
