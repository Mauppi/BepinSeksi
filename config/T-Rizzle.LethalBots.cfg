# Setting type: Boolean
# Default value: true
Allow automatic mission control assignment = true

## Should every available bot make at least one physical field/scrap run per expedition instead of leaving one bot permanently safe at the terminal? A follow order from a real player or the grounded LLM tool stays in follow mode and satisfies the run after the bot physically deploys with that leader. Other explicit high-priority orders and active emergencies take precedence, and forced deployment is waived on eclipsed or already-late rounds. Hard moons use defensive equipment instead of automatically excusing the run.
# Setting type: Boolean
# Default value: true
Require every bot to make a scrap run = true

