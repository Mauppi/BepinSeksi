## Settings file was created by plugin LethalBots v12.1.22
## Plugin GUID: T-Rizzle.LethalBots

[1. General Settings]

## How many players should Lethal Bots try to keep in the lobby? 
##  This respects max lobby size. 
##  Be aware of possible performance problems when more than ~16 bots spawned
# Setting type: Int32
# Default value: 16
# Acceptable value range: From 0 to 50
Player Quota = 16

## How should the Player Quota be used? 
##  NORMAL: Maintains the total number of players (humans + bots) at the configured quota. 
##  FILL: Maintains exactly the configured number of bots, regardless of how many human players are connected.
# Setting type: EnumQuotaType
# Default value: Normal
# Acceptable values: Normal, Fill
Quota Type = Normal

## Do bots automatically join and leave to keep the desired player quota? (Bots must be allowed in orbit!)
# Setting type: Boolean
# Default value: true
Bots Auto Join = true

## Are bots allowed to stay on the ship while its in orbit? If false, bots will automatically leave and rejoin between rounds.
# Setting type: Boolean
# Default value: true
Allow bots in orbit (YOU MUST HAVE NavmeshInCompanyRedux!) = true

## Should bots display their Billboard State Indicator?
# Setting type: Boolean
# Default value: false
Show bot Billboard State Indicator = false

[2. Bot identities]

## For single/manual bot spawns, choose a random available identity from the file rather than the next one in order. Round auto-spawn always shuffles defined identities.
# Setting type: Boolean
# Default value: false
Randomness of identities = true

## Should the LethalBotManager reset all identities after the game over fired screen? (NOTE: This will make bots lose all progress and levels in that identity!)
# Setting type: Boolean
# Default value: false
Reset identities when fired = true

## One-shot host reset for the next normal save slot you load. This clears all bot identity progress and that slot's persisted generated-dialogue memory, then automatically returns to false even when no previous LethalBots save data exists. Challenge saves do not consume this option.
# Setting type: Boolean
# Default value: false
Reset identities (Host only) = false

[3. Behavior]

## Should the bot crouch like the player is crouching? (NOTE: This will not affect the dynamic crouching AI!)
# Setting type: Boolean
# Default value: true
Crouch with player = true

## When a bot is following you, how should they follow you by default? 
