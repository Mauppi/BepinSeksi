## Settings file was created by plugin Gamblers Mod v1.0.0
## Plugin GUID: Hamm3rhart.GamblersMod

[Audio]

## Enable gambling machine music (CLIENT SIDE)
# Setting type: Boolean
# Default value: true
GambleMachineMusicEnabled = true

## Gambling machine music volume (CLIENT SIDE)
# Setting type: Single
# Default value: 0.35
GambleMachineMusicVolume = 0.35

[Gambling Chances]

## Chance to roll a jackpot. Ex. If set to 3, you have a 3% chance to get a jackpot. Make sure ALL your chance values add up to 100 or else the math won't make sense!
# Setting type: Int32
# Default value: 3
JackpotChance = 3

## Chance to roll a triple. Ex. If set to 11, you have a 11% chance to get a triple. Make sure ALL your chance values add up to 100 or else the math won't make sense!
# Setting type: Int32
# Default value: 11
TripleChance = 11

## Chance to roll a double. Ex. If set to 27, you have a 27% chance to get a double. Make sure ALL your chance values add up to 100 or else the math won't make sense!
# Setting type: Int32
# Default value: 27
DoubleChance = 27

## Chance to roll a halve. Ex. If set to 49, you have a 49% chance to get a halve. Make sure ALL your chance values add up to 100 or else the math won't make sense!
# Setting type: Int32
# Default value: 49
HalveChance = 49

## Chance to roll a zero. Ex. If set to 12, you have a 12% chance to get a zero. Make sure ALL your chance values add up to 100 or else the math won't make sense!
# Setting type: Int32
# Default value: 9
ZeroChance = 9

## Chance to explode. Make sure ALL your chance values add up to 100 or else the math won't make sense!
# Setting type: Int32
# Default value: 1
ExplodeChance = 1

[Gambling Multipliers]

## Jackpot multiplier
# Setting type: Single
# Default value: 10
JackpotMultiplier = 10

## Triple multiplier
# Setting type: Single
# Default value: 3
TripleMultiplier = 3

## Double multiplier
# Setting type: Single
# Default value: 2
DoubleMultiplier = 2

## Halve multiplier
# Setting type: Single
# Default value: 0.5
HalveMultiplier = 0.5

## Zero multiplier
# Setting type: Single
# Default value: 0
ZeroMultiplier = 0

## Explode multiplier applied before the explosion
# Setting type: Single
# Default value: 0
ExplodeMultiplier = 0

[General Machine Settings]

## Cooldown of the machine. Reducing this will cause the drumroll sound to not sync & may also cause latency issues
# Setting type: Int32
# Default value: 4
gamblingMachineMaxCooldown = 4

## Number of times a gambling machine can be used
# Setting type: Int32
# Default value: 9999
Number Of Uses = 9999

## Maximum scrap value after gambling. 0 or negative disables the cap
# Setting type: Int32
# Default value: 2147483647
Max Value Limit = 2147483647

## Enable verbose debug logging for the mod
# Setting type: Boolean
# Default value: false
Enable Debug Logging = false

[Machine Layout]

## Machine spawn mode: AUTO spawns up to the player count, MAX fills the grid capacity
# Setting type: String
# Default value: AUTO
# Acceptable values: AUTO, MAX
Machine Spawn Mode = AUTO

## How many rows of gambling machines will be spawned (along X). Allows negatives in spacing to flip direction
# Setting type: Int32
# Default value: 1
Number Of Rows = 1

## How many gambling machines to place per row (along Z). Allows negatives in spacing to flip direction
# Setting type: Int32
# Default value: 12
Machines Per Row = 12

## Distance between rows of machines along X. Decimals allowed (e.g. 0.3). Zero falls back to 5
# Setting type: Single
# Default value: 5
Row Spacing = 5

## Distance between machines in a row along Z. Decimals allowed (e.g. 0.3). Zero falls back to 5
# Setting type: Single
# Default value: 5
Machine Spacing = 5

## Yaw rotation for each machine in degrees (0-359). Invalid values fall back to 90
# Setting type: Single
# Default value: 90
Machine Rotation = 90

## Offset the anchor position on the X axis (rows). Decimals allowed. 0 keeps the base point
# Setting type: Single
# Default value: 0
Layout Offset X = 0

## Offset the anchor position on the Y axis (height). Decimals allowed. 0 keeps the base point
# Setting type: Single
# Default value: 0
Layout Offset Y = 0

## Offset the anchor position on the Z axis (columns). Decimals allowed. 0 keeps the base point
# Setting type: Single
# Default value: 0
Layout Offset Z = 0

